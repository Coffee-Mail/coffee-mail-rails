name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: Coffee-Mail/coffee-mail-sdk-ruby
          path: sdk
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
        env:
          COFFEEMAIL_SDK_PATH: sdk
      - name: Tag igual a CoffeeMail::VERSION e CHANGELOG
        run: bin/check-version-sync --tag "$GITHUB_REF_NAME"
      - name: Gates de qualidade
        run: bundle exec rake
        env:
          COFFEEMAIL_SDK_PATH: sdk
      - name: Publicar no RubyGems (trusted publishing)
        uses: rubygems/release-gem@v1
      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
