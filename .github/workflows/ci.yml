name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "ruby"]
        rails: ["~> 7.1.0", "~> 7.2.0", "~> 8.0.0"]
    env:
      RAILS_VERSION: ${{ matrix.rails }}
      COFFEEMAIL_SDK_PATH: sdk
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: SDK Ruby (até a primeira versão publicada)
        uses: actions/checkout@v7
        with:
          repository: Coffee-Mail/coffee-mail-sdk-ruby
          path: sdk
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Versão sincronizada
        run: bin/check-version-sync
      - name: Regras da casa
        run: bundle exec rubocop --only CoffeeMail
      - name: Lint
        run: bundle exec rubocop
      - name: Tipos
        run: |
          bundle exec rbs collection install
          bundle exec steep check
      - name: Testes com cobertura
        run: bundle exec rspec
      - name: Rastreabilidade SDD
        run: bin/check-spec-coverage
      - name: Compatibilidade da API pública
        run: bin/check-api-compat
      - name: Build do pacote
        run: gem build coffeemail-rails.gemspec

  vulnerabilities:
    runs-on: ubuntu-latest
    env:
      COFFEEMAIL_SDK_PATH: sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Coffee-Mail/coffee-mail-sdk-ruby
          path: sdk
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - run: bundle exec bundler-audit check --update

  public-repository:
    name: sem referências a repositórios privados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          if git grep -nIE 'coffee-mail-(a)pi|coffee-mail-(w)eb'; then
            echo "::error::Repositório público não pode citar repositórios privados."
            exit 1
          fi
