name: Reportar bug
description: Algo não funciona como esperado
labels: [bug]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu
      description: Descreva o comportamento observado e o esperado.
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      description: Código mínimo que reproduz o problema. Não inclua chaves de API.
      render: ruby
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: Versão do SDK
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: ruby
    attributes:
      label: Versão do Ruby
      placeholder: "3.3.6"
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: x-request-id (se houver)
      description: Disponível em CoffeeMail::Error#request_id.
